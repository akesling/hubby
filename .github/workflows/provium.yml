name: Provium

on:
  push:
    paths: ["provium/**", ".github/workflows/provium.yml"]
  pull_request:
    paths: ["provium/**", ".github/workflows/provium.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Lean's kernel needs more than Provium's 2 GiB default for the larger
      # proof projects; standard runners have 16 GB.
      PROVIUM_LEAN_MEMORY_MB: 8192
    # The complete gate kernel-checks every Lean fixture serially (over an hour).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup component add clippy rustfmt --toolchain stable
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat provium/lean-toolchain)"
      # cargo metadata --offline needs every locked package, including
      # platform-specific ones the build never downloads.
      - run: cargo +stable fetch --locked --manifest-path provium/Cargo.toml
      - run: provium/scripts/check.sh
        env:
          RUSTUP_TOOLCHAIN: stable
      - uses: actions/upload-artifact@v7
        with:
          name: provium-proof-evidence
          path: provium/artifacts/assertions
