name: Jarl

on:
  push:
    paths: ["jarl/**", "provium/**", "Cargo.toml", "Cargo.lock", ".github/workflows/jarl.yml"]
  pull_request:
    paths: ["jarl/**", "provium/**", "Cargo.toml", "Cargo.lock", ".github/workflows/jarl.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup component add clippy rustfmt --toolchain stable
      - run: rustup target add wasm32-unknown-unknown thumbv7em-none-eabi --toolchain stable
      - name: Install Provium's supported Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat provium/lean-toolchain)"
      - run: cargo +stable fetch --locked
      - run: cargo +stable fmt -p jarl -- --check
      - run: cargo +stable clippy -p jarl --all-targets --locked --offline -- -D warnings
      - run: cargo +stable test -p jarl --locked --offline
      - run: cargo +stable test -p jarl --release --locked --offline
      - run: python3 jarl/tools/mutations.py
      - run: cargo +stable doc -p jarl --no-deps --locked --offline
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo +stable check -p jarl --target wasm32-unknown-unknown --locked --offline
      - run: cargo +stable check -p jarl --target thumbv7em-none-eabi --locked --offline
      - run: jarl/scripts/verify-m0.sh
        env:
          RUSTUP_TOOLCHAIN: stable
      - run: jarl/scripts/verify.sh
        env:
          RUSTUP_TOOLCHAIN: stable
      - uses: actions/upload-artifact@v7
        with:
          name: jarl-proof-evidence
          path: jarl/artifacts/provium
